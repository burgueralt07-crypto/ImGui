name: Build x64 Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: MSVC x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-x64-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-x64-

      - name: CMake Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: CMake Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rss-external-x64-release
          # Procura o .exe direto na pasta build (conforme configurado no CMakeLists.txt)
          path: build/rss-external.exe
          retention-days: 7
          if-no-files-found: error
